name: Build Linux 9Router

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Pack deploy artifact
        run: |
          mkdir -p deploy
          cp -r .next public node_modules package.json deploy/
          tar -czf 9router-linux.tar.gz -C deploy .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9router-linux
          path: 9router-linux.tar.gz
          retention-days: 1
